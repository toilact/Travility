name: Database smoke

on:
  push:
    branches:
      - feat/foundation-walking-skeleton
  workflow_dispatch:

jobs:
  database-smoke:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQL Server Express and locate sqlcmd
        shell: pwsh
        run: |
          choco install sql-server-express --version=2022.16.0.20260305 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "SQL Server Express installation failed with exit code $LASTEXITCODE."
          }

          $service = Get-Service 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw 'The SQL Server Express SQLEXPRESS service was not installed.'
          }

          if ($service.Status -ne 'Running') {
            Start-Service -Name $service.Name
            $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          }

          $sqlCmd = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue
          if ($null -eq $sqlCmd) {
            throw 'sqlcmd.exe is not installed on the Windows runner.'
          }

          Write-Host "SQL Server service: $($service.Name) ($($service.Status))"
          Write-Host "sqlcmd: $($sqlCmd.Source)"

      - name: Run database reset, schema, seed and smoke
        shell: pwsh
        run: |
          $sqlCmd = (Get-Command sqlcmd.exe).Source
          $arguments = @('-S', '.\SQLEXPRESS', '-E', '-b', '-f', '65001', '-i')
          $scripts = @(
            'database\reset-dev.sql',
            'database\schema.sql',
            'database\seed_reference.sql',
            'database\seed_demo.sql',
            'database\smoke_test.sql'
          )

          foreach ($script in $scripts) {
            Write-Host "Running $script"
            & $sqlCmd @arguments $script
            if ($LASTEXITCODE -ne 0) {
              throw "$script failed with exit code $LASTEXITCODE."
            }
          }

      - name: Verify seed rerun is safe
        shell: pwsh
        run: |
          $sqlCmd = (Get-Command sqlcmd.exe).Source
          foreach ($script in @('database\seed_reference.sql', 'database\seed_demo.sql', 'database\smoke_test.sql')) {
            Write-Host "Re-running $script"
            & $sqlCmd -S '.\SQLEXPRESS' -E -b -f 65001 -i $script
            if ($LASTEXITCODE -ne 0) {
              throw "$script rerun failed with exit code $LASTEXITCODE."
            }
          }
