name: Windows build

on:
  push:
    branches:
      - main
      - feat/foundation-walking-skeleton
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Verify Visual Studio 2022 toolchain
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found at $vswhere."
          }

          $installationPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -version '[17.0,18.0)' -property installationPath
          $installationVersion = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -version '[17.0,18.0)' -property installationVersion
          if ([string]::IsNullOrWhiteSpace($installationPath) -or [string]::IsNullOrWhiteSpace($installationVersion)) {
            throw "No Visual Studio 2022 installation with MSBuild was found."
          }

          Write-Host "Visual Studio installation: $installationPath"
          Write-Host "Visual Studio version: $installationVersion"
          if ($installationPath -notmatch "(?i)\\Microsoft Visual Studio\\2022\\") {
            throw "Visual Studio path is not a Visual Studio 2022 installation: $installationPath."
          }

          if ($installationVersion -notmatch "^17\.") {
            throw "Visual Studio version is not v17: $installationVersion."
          }

          $msbuildOutput = & msbuild -version 2>&1
          $msbuildExitCode = $LASTEXITCODE
          $msbuildOutput | ForEach-Object { Write-Host $_ }
          $msbuildText = $msbuildOutput | Out-String
          if ($msbuildExitCode -ne 0) {
            throw "msbuild -version failed with exit code $msbuildExitCode."
          }

          if ($msbuildText -notmatch "(?m)MSBuild version 17\.") {
            throw "msbuild -version did not report an MSBuild v17 toolchain."
          }

      - name: Restore packages
        run: nuget restore Travility.sln

      - name: Build Debug
        run: msbuild Travility.sln /m /p:Configuration=Debug

      - name: Run architecture tests
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found at $vswhere."
          }

          $installationPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -version '[17.0,18.0)' -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "No Visual Studio 2022 installation with MSBuild was found."
          }

          $vstestConsole = Join-Path $installationPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          if (-not (Test-Path -LiteralPath $vstestConsole)) {
            throw "vstest.console.exe was not found at $vstestConsole."
          }

          $testAssembly = Join-Path $env:GITHUB_WORKSPACE "tests\Travility.Tests\bin\Debug\Travility.Tests.dll"
          if (-not (Test-Path -LiteralPath $testAssembly)) {
            throw "Expected test assembly was not produced: $testAssembly."
          }

          $vstestOutput = & $vstestConsole $testAssembly 2>&1
          $vstestExitCode = $LASTEXITCODE
          $vstestOutput | ForEach-Object { Write-Host $_ }
          $outputText = $vstestOutput | Out-String

          if ($vstestExitCode -ne 0) {
            throw "vstest.console.exe failed with exit code $vstestExitCode."
          }

          if ($outputText -match "(?im)(test discovery.*(failed|error|exception)|failed to discover|no test is available)") {
            throw "VSTest reported a discovery failure."
          }

          $testTotal = [regex]::Match($outputText, "(?m)Total tests:\s*(\d+)")
          if (-not $testTotal.Success) {
            throw "VSTest did not report a test count."
          }

          if ([int]$testTotal.Groups[1].Value -eq 0) {
            throw "VSTest discovered zero tests."
          }

      - name: Build Release
        run: msbuild Travility.sln /m /p:Configuration=Release
